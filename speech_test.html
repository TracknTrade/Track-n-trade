<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Speech Test</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0; padding: 20px; background: #f1f5f9; color: #1e293b;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  .sub { color: #64748b; font-size: 0.9rem; margin-bottom: 20px; }
  #supportBox {
    padding: 14px; border-radius: 12px; font-weight: 700; margin-bottom: 20px;
  }
  .ok { background: #dcfce7; color: #166534; }
  .bad { background: #fee2e2; color: #991b1b; }
  #recBtn {
    width: 100%; padding: 28px; font-size: 1.4rem; font-weight: 800;
    border: none; border-radius: 16px; background: #065f46; color: #fff;
    margin-bottom: 20px;
  }
  #recBtn.listening { background: #dc2626; }
  #recBtn:disabled { background: #94a3b8; }
  .box {
    background: #fff; border: 2px solid #e2e8f0; border-radius: 12px;
    padding: 16px; margin-bottom: 16px; min-height: 60px;
  }
  .label { font-size: 0.8rem; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 6px; }
  #finalText { font-size: 1.3rem; font-weight: 700; }
  #interimText { color: #94a3b8; font-style: italic; }
  #statusText { font-size: 0.9rem; color: #64748b; }
  #log { font-size: 0.8rem; color: #94a3b8; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>Speech Recognition Test</h1>
  <div class="sub">Not part of the real app — just checking if this phone/browser can hear and transcribe reliably.</div>

  <div id="supportBox">Checking support...</div>

  <button id="recBtn">Tap to Speak</button>

  <div class="box">
    <div class="label">What it heard (final)</div>
    <div id="finalText">—</div>
  </div>

  <div class="box">
    <div class="label">Live / interim (while still listening)</div>
    <div id="interimText">—</div>
  </div>

  <div class="box">
    <div class="label">Status</div>
    <div id="statusText">Idle</div>
  </div>

  <div class="box">
    <div class="label">Event log</div>
    <div id="log"></div>
  </div>

<script>
  const supportBox = document.getElementById('supportBox');
  const recBtn = document.getElementById('recBtn');
  const finalText = document.getElementById('finalText');
  const interimText = document.getElementById('interimText');
  const statusText = document.getElementById('statusText');
  const logEl = document.getElementById('log');

  function log(msg) {
    const t = new Date().toLocaleTimeString();
    logEl.textContent = '[' + t + '] ' + msg + '\n' + logEl.textContent;
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SR) {
    supportBox.textContent = 'NOT SUPPORTED — this browser has no SpeechRecognition API at all.';
    supportBox.className = 'bad';
    recBtn.disabled = true;
    statusText.textContent = 'Unavailable';
    log('window.SpeechRecognition and window.webkitSpeechRecognition are both undefined.');
  } else {
    supportBox.textContent = 'API detected (' + (window.SpeechRecognition ? 'SpeechRecognition' : 'webkitSpeechRecognition') + '). Tap the button and allow microphone access if asked.';
    supportBox.className = 'ok';
    log('SpeechRecognition API found.');

    const recognition = new SR();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-AU';

    let listening = false;

    recognition.onstart = function() {
      listening = true;
      recBtn.textContent = 'Listening... (tap to stop)';
      recBtn.classList.add('listening');
      statusText.textContent = 'Listening...';
      log('onstart fired.');
    };

    recognition.onresult = function(event) {
      let finalStr = '';
      let interimStr = '';
      for (let i = 0; i < event.results.length; i++) {
        const r = event.results[i];
        if (r.isFinal) finalStr += r[0].transcript + ' ';
        else interimStr += r[0].transcript;
      }
      if (finalStr) {
        finalText.textContent = finalStr.trim();
        log('final: "' + finalStr.trim() + '"');
      }
      interimText.textContent = interimStr || '—';
    };

    recognition.onerror = function(event) {
      log('ERROR: ' + event.error);
      statusText.textContent = 'Error: ' + event.error;
    };

    recognition.onend = function() {
      listening = false;
      recBtn.textContent = 'Tap to Speak';
      recBtn.classList.remove('listening');
      statusText.textContent = 'Stopped.';
      log('onend fired.');
    };

    recBtn.addEventListener('click', function() {
      if (listening) {
        recognition.stop();
      } else {
        finalText.textContent = '—';
        interimText.textContent = '—';
        try {
          recognition.start();
          log('recognition.start() called.');
        } catch (e) {
          log('start() threw: ' + e.message);
        }
      }
    });
  }
</script>
</body>
</html>
